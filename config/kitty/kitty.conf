# ══════════════════════════════════════════════════════════════
# 🐱 Kitty Configuration - Glassy & Dynamic
# ══════════════════════════════════════════════════════════════

# ─── Fonts ────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# ─── Window Layout ────────────────────────────────────────────
remember_window_size  yes
initial_window_width  1000
initial_window_height 650
window_padding_width  15
placement_strategy    center
hide_window_decorations yes

# ─── Glass Effect ─────────────────────────────────────────────
# Transparency (handled by compositor blur for glass effect)
background_opacity 0.7
dynamic_background_opacity yes

# ─── Tabs ─────────────────────────────────────────────────────
tab_bar_edge      top
tab_bar_style     powerline
tab_powerline_style slanted
tab_bar_margin_width 5.0
tab_bar_margin_height 5.0 0.0

# Active Tab (High Contrast)
active_tab_foreground   #000
active_tab_background   #fff
active_tab_font_style   bold-italic

# Inactive Tab
inactive_tab_foreground #eee
inactive_tab_background #444
inactive_tab_font_style normal

# ─── Color Scheme ─────────────────────────────────────────────
# Import Pywal colors
include ~/.cache/wal/colors-kitty.conf

# Fallback (Dracula-ish) if Pywal fails
# foreground #f8f8f2
# background #282a36

# ─── Advanced ─────────────────────────────────────────────────
allow_remote_control yes
listen_on unix:/tmp/mykitty
shell_integration enabled

# ─── Keybindings ──────────────────────────────────────────────
# Clipboard

# Window Management
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+w     close_window
map ctrl+shift+]     next_tab
map ctrl+shift+[     previous_tab

# Font Resizing
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# Scrolling
map shift+up        scroll_line_up
map shift+down      scroll_line_down
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
