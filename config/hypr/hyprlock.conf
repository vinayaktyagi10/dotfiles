# ══════════════════════════════════════════════════════════════
# 🌈 Hyprlock Configuration - Pywal Dynamic Theme
# ══════════════════════════════════════════════════════════════

source = ~/.cache/wal/colors-hyprland.conf

# ─── General Settings ─────────────────────────────────────────
general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 2
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
}

# ─── Background ───────────────────────────────────────────────
background {
    monitor =
    path = /home/vinayak/.cache/current_wallpaper.png
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vignette = 0.2
    color = $background
}

# ─── Input Field ──────────────────────────────────────────────
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $color1
    inner_color = $background
    font_color = $foreground
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
    check_color = $color2
    fail_color = $color1
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
}

# ─── Time Display ─────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%-I:%M")</b>"
    color = $foreground
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
}

# ─── Date Display ─────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %-d')"
    color = $color2
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

# ─── User Greeting ────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "Hi there, $USER"
    color = $color4
    font_size = 20
    font_family = JetBrainsMono Nerd Font Italic
    position = 0, -60
    halign = center
    valign = center
}