################
### MONITORS ###
################

# Import Pywal colors
source = /home/vinayak/.cache/wal/colors-hyprland.conf

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=eDP-1,2560x1600@165,0x0,1


###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$terminalFileManager = kitty --class yazi -e yazi
$menu = rofi -show drun
$browser = zen-browser

#################
### AUTOSTART ###
#################

exec-once = swww-daemon
exec-once = pypr
exec-once = swaync
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec = ~/.scripts/waybar-launch.sh
exec-once = wal -R

# Clipboard Manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Idle Daemon
exec-once = hypridle


#############################
### ENVIRONMENT VARIABLES ###
#############################

# Load Active GPU Profile (NVIDIA vs AMD)
source = ~/.config/hypr/gpu/active.conf

# Theme settings
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland;xcb

# Cursor settings
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

debug {
    damage_tracking = 2 
}

general {
    gaps_in = 5
    gaps_out = 2
    border_size = 2
    col.active_border = $color11 $color14 45deg
    col.inactive_border = $color1
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = false
    }
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
        ignore_opacity = true
        new_optimizations = true
    }
}

animations {
    enabled = yes
    bezier = windy, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, windy, slide
    animation = workspaces, 1, 3, windy
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    vfr = true
    vrr = 0
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gestures {
    gesture = 3, horizontal, workspace
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Apps
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, wlogout
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, R, exec, $menu
bind = $mainMod, W, exec, $browser
bind = $mainMod, O, exec, /home/vinayak/.scripts/wallpaper-selector.sh

# GPU / Tools
bind = $mainMod, G, exec, /home/vinayak/.scripts/gpu-switch.sh
bind = $mainMod SHIFT, P, exec, hyprpicker -a
bind = $mainMod SHIFT, E, exec, $terminal -e yazi

# Scratchpads (Pyprland)
bind = $mainMod, S, exec, pypr toggle term
bind = $mainMod SHIFT, V, exec, pypr toggle volume

# Layout / Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, C, centerwindow

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move active window to next/prev workspace with mainMod + SHIFT + scroll
bind = $mainMod SHIFT, mouse_down, movetoworkspace, e+1
bind = $mainMod SHIFT, mouse_up, movetoworkspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots
bind = $mainMod, A, exec, ~/.local/bin/shotfile
bind = $mainMod, D, exec, ~/.local/bin/shotclip

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrulev2 = opacity 0.90 0.85, class:^(kitty)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(yazi)$
windowrulev2 = size 1200 800, class:^(yazi)$
windowrulev2 = center, class:^(yazi)$